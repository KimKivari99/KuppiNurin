name: Sync Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"

concurrency:
  group: wiki-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    name: Publish wiki pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIKI_BRANCH: master  # GitHub wiki repositories use 'master' as their default branch
    steps:
      - uses: actions/checkout@v4

      - name: Checkout wiki repository
        id: checkout-wiki
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize wiki repository
        if: steps.checkout-wiki.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf wiki-repo
          mkdir wiki-repo
          cd wiki-repo
          git init -b ${{ env.WIKI_BRANCH }}
          git remote add origin https://github.com/${{ github.repository }}.wiki.git
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GITHUB_TOKEN}"; }; f'

      - name: Copy wiki pages
        run: cp -r wiki/. wiki-repo/

      - name: Commit and push
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Sync wiki from main repository"
            git push origin ${{ env.WIKI_BRANCH }}
          fi
